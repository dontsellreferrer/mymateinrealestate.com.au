<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're in — My Mate in Real Estate</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #0E2A44; --coral: #E07856; --swell: #2A6EA8;
    --sand: #E8D9BE; --paper: #F4EEE2; --cream: #FAF6EC;
    --ink: #141111; --white: #FFFFFF;
    --r-purple: #1E1040; --r-orange: #FF6200; --r-orangeLt: #FF7A1A;
  }
  body { font-family: "Plus Jakarta Sans", sans-serif; background: var(--cream); color: var(--ink); min-height: 100svh; display: flex; flex-direction: column; }

  .site-header {
    padding: 1.125rem clamp(1.25rem,5vw,3.5rem);
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid rgba(14,42,68,0.07); background: var(--cream);
  }
  .header-logo { display: flex; align-items: baseline; gap: 0.15em; text-decoration: none; font-size: 1rem; font-weight: 700; color: var(--navy); }
  .header-logo em { font-family: "Instrument Serif", serif; font-style: italic; color: var(--coral); font-size: 1.3em; line-height: 1; }

  main {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: clamp(2.5rem,6vw,4.5rem) clamp(1.25rem,5vw,2rem);
    max-width: 760px; margin: 0 auto; width: 100%; gap: 1.25rem;
  }

  .confirm-banner {
    width: 100%; background: var(--navy); border-radius: 18px;
    padding: 1.5rem 1.75rem; display: flex; align-items: flex-start; gap: 1.25rem;
    border-left: 4px solid var(--coral);
    animation: slideDown 0.5s cubic-bezier(0.22,1,0.36,1) forwards;
  }
  .confirm-tick {
    width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0;
    background: var(--coral); display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem; color: var(--white); font-weight: 700;
  }
  .confirm-text h2 { font-size: 1.175rem; font-weight: 800; color: var(--cream); letter-spacing: -0.02em; margin-bottom: 0.35rem; }
  .confirm-text p { font-size: 0.9rem; color: var(--sand); line-height: 1.6; opacity: 0.85; }

  .paths {
    display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; width: 100%;
    animation: fadeUp 0.5s 0.15s cubic-bezier(0.22,1,0.36,1) both;
  }
  .path {
    background: var(--white); border-radius: 16px; padding: 1.5rem;
    border: 1.5px solid rgba(14,42,68,0.1);
    display: flex; flex-direction: column; gap: 0.625rem;
  }
  .path.featured { background: var(--r-purple); border-color: var(--r-orange); }
  .path-label { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
  .path .path-label { color: var(--swell); }
  .path.featured .path-label { color: var(--r-orange); }
  .path h3 { font-size: 1rem; font-weight: 700; color: var(--navy); line-height: 1.25; }
  .path.featured h3 { color: var(--white); }
  .path > p { font-size: 0.85rem; line-height: 1.6; color: var(--ink); opacity: 0.6; }
  .path.featured > p { color: rgba(255,255,255,0.5); opacity: 1; }

  /* Commission tiles with expand */
  .commission-reveal { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.25rem; }

  .comm-tile {
    background: var(--paper); border-radius: 10px; border: 1px solid rgba(14,42,68,0.08);
    overflow: hidden;
  }
  .comm-tile-header {
    display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
    padding: 0.7rem 0.875rem; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .comm-tile-header:hover { background: rgba(14,42,68,0.03); }
  .comm-tile-left { flex: 1; }
  .comm-tile-label { font-size: 0.8rem; font-weight: 700; color: var(--navy); }
  .comm-tile-sub { font-size: 0.7rem; color: var(--ink); opacity: 0.45; margin-top: 0.1rem; }
  .comm-tile-right { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }
  .comm-tile-share { font-size: 0.9rem; font-weight: 800; color: var(--r-orange); white-space: nowrap; }
  .comm-tile-chevron {
    width: 16px; height: 16px; opacity: 0.35; flex-shrink: 0;
    transition: transform 0.25s;
  }
  .comm-tile.open .comm-tile-chevron { transform: rotate(180deg); }

  .comm-tile-detail {
    max-height: 0; overflow: hidden;
    transition: max-height 0.3s cubic-bezier(0.4,0,0.2,1);
  }
  .comm-tile.open .comm-tile-detail { max-height: 300px; }
  .comm-tile-detail-inner {
    padding: 0 0.875rem 0.875rem;
    border-top: 1px solid rgba(14,42,68,0.07);
    padding-top: 0.75rem;
  }
  .comm-detail-row {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 0.75rem; padding: 0.3rem 0;
    border-bottom: 1px solid rgba(14,42,68,0.06);
  }
  .comm-detail-row:last-child { border-bottom: none; }
  .comm-detail-label { color: var(--ink); opacity: 0.55; }
  .comm-detail-value { font-weight: 600; color: var(--navy); text-align: right; }
  .comm-detail-value.highlight { color: var(--r-orange); }

  .commission-note { font-size: 0.7rem; color: var(--ink); opacity: 0.38; line-height: 1.5; margin-top: 0.375rem; }

  .referrer-logo-wrap { max-width: 170px; margin-bottom: 0.25rem; }
  .referrer-logo-wrap svg { width: 100%; height: auto; display: block; }

  .video-placeholder {
    width: 100%; aspect-ratio: 16/9; background: var(--paper); border-radius: 10px;
    border: 1.5px dashed rgba(14,42,68,0.18);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 0.5rem; margin-top: 0.25rem; cursor: pointer; transition: background 0.2s;
  }
  .video-placeholder:hover { background: var(--sand); }
  .video-play {
    width: 44px; height: 44px; border-radius: 50%; background: var(--coral);
    display: flex; align-items: center; justify-content: center; opacity: 0.8;
  }
  .video-placeholder-label { font-size: 0.75rem; font-weight: 600; color: var(--navy); opacity: 0.4; }

  .path-btn {
    display: inline-flex; align-items: center; gap: 0.4rem;
    padding: 0.7rem 1.25rem; border-radius: 100px;
    font-size: 0.875rem; font-weight: 700; text-decoration: none;
    transition: background 0.2s, transform 0.15s; width: fit-content; margin-top: auto;
  }
  .path-btn:hover { transform: translateY(-1px); }
  .path-btn.primary { background: var(--r-orange); color: var(--white); }
  .path-btn.primary:hover { background: var(--r-orangeLt); }

  .footer-note {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    background: rgba(14,42,68,0.04); border-radius: 12px; padding: 1rem 1.25rem;
    animation: fadeUp 0.5s 0.3s cubic-bezier(0.22,1,0.36,1) both;
  }
  .footer-note p { font-size: 0.8rem; color: var(--ink); opacity: 0.5; line-height: 1.5; max-width: 52ch; }
  .footer-note a { font-size: 0.85rem; font-weight: 700; color: var(--navy); text-decoration: none; white-space: nowrap; margin-left: 1.5rem; opacity: 0.5; transition: opacity 0.2s; }
  .footer-note a:hover { opacity: 1; }

  @keyframes slideDown { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: none; } }
  @keyframes fadeUp    { from { opacity: 0; transform: translateY(16px);  } to { opacity: 1; transform: none; } }

  @media (max-width: 600px) {
    .paths { grid-template-columns: 1fr; }
    .confirm-banner { flex-direction: column; gap: 0.875rem; }
    .footer-note { flex-direction: column; gap: 0.75rem; align-items: flex-start; }
    .footer-note a { margin-left: 0; }
  }
  @media (max-width: 400px) {
    main { padding: 1.75rem 1.125rem; }
    .confirm-banner { padding: 1.25rem; }
    .path { padding: 1.25rem; }
  }
</style>
</head>

  var logoSvg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 648 216.667">' + LOGO_PATHS + '</svg>';

  // ── Build DOM nodes directly — no innerHTML for user data ──────────────────
  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function(k) {
      if (k === 'class') node.className = attrs[k];
      else node.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function(c) {
      if (typeof c === 'string') node.appendChild(document.createTextNode(c));
      else if (c) node.appendChild(c);
    });
    return node;
  }
  function html(tag, attrs, htmlStr) {
    var node = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function(k) {
      if (k === 'class') node.className = attrs[k];
      else node.setAttribute(k, attrs[k]);
    });
    node.innerHTML = htmlStr;
    return node;
  }

  // ── Commission tiles with expand ───────────────────────────────────────────
  function toggleTile(tile) {
    tile.classList.toggle('open');
  }

  function commTile(label, sub, share, detailRows) {
    var tile   = el('div', {'class':'comm-tile'});
    var header = el('div', {'class':'comm-tile-header'});
    header.onclick = function() { toggleTile(tile); };

    var left = el('div', {'class':'comm-tile-left'});
    left.appendChild(el('div', {'class':'comm-tile-label'}, [label]));
    if (sub) left.appendChild(el('div', {'class':'comm-tile-sub'}, [sub]));

    var right = el('div', {'class':'comm-tile-right'});
    right.appendChild(el('div', {'class':'comm-tile-share'}, [share]));
    right.innerHTML += '<svg class="comm-tile-chevron" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="#0E2A44" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

    header.appendChild(left);
    header.appendChild(right);

    var detail = el('div', {'class':'comm-tile-detail'});
    var inner  = el('div', {'class':'comm-tile-detail-inner'});
    detailRows.forEach(function(r) {
      var row = el('div', {'class':'comm-detail-row'});
      row.appendChild(el('span', {'class':'comm-detail-label'}, [r[0]]));
      var val = el('span', {'class': r[2] ? 'comm-detail-value highlight' : 'comm-detail-value'}, [r[1]]);
      row.appendChild(val);
      inner.appendChild(row);
    });
    detail.appendChild(inner);

    tile.appendChild(header);
    tile.appendChild(detail);
    return tile;
  }

  function buildCommission(tiles, note) {
    var wrap = el('div', {'class':'commission-reveal'});
    tiles.forEach(function(t) { wrap.appendChild(t); });
    wrap.appendChild(el('p', {'class':'commission-note'}, [note]));
    return wrap;
  }

  // Mate commission tiles
  var mateCommission = buildCommission([
    commTile(
      'Broker referral', 'You refer a home loan',
      '80% of pool',
      [
        ['Example', '$600K loan \xd7 0.65% = $3,900 gross', false],
        ['Broker contributes', '50% = $1,950', false],
        ['Platform retains', '20% of pool = $390', false],
        ['You receive', '$1,560 + GST', true],
      ]
    ),
    commTile(
      'PM referral', 'You refer a landlord/investor',
      '80% of pool',
      [
        ['Example', '$600/wk \xd7 6% \xd7 52wks = $1,872/yr', false],
        ['PM contributes', '100% of first year fee = $1,872', false],
        ['Platform retains', '20% of pool = $374', false],
        ['You receive', '$1,497.60 + GST', true],
      ]
    ),
    commTile(
      'If you take over the sale', 'Owner lists with you as their agent',
      '80% of gross',
      [
        ['Example', '$900K \xd7 2% = $18,000 gross', false],
        ['Platform retains', '20% = $3,600', false],
        ['You receive', '$14,400 + GST', true],
      ]
    ),
  ], 'Actual amounts vary by deal size. Settlement or first fee receipt is the payment trigger. Full detail at referrer.com.au.');

  // Referrer commission tiles
  var referrerCommission = buildCommission([
    commTile(
      'Every referral fee', 'You send the lead, we do the rest',
      '90%',
      [
        ['Platform fee', '10% only \u2014 not 20%', false],
        ['You keep', '90% of every referral fee', true],
        ['Example: 1 broker referral/wk', '\u2248$60,000+ per year', true],
      ]
    ),
    commTile(
      'No reciprocal obligation', 'Pure originator status',
      '10% fee only',
      [
        ['You give', 'Leads via your platform or network', false],
        ['You get', '90% of every conversion fee', true],
        ['Licensed service required?', 'No', false],
      ]
    ),
  ], 'You\u2019re a pure originator \u2014 give leads, earn income. Settlement is the payment trigger.');

  // ── Video placeholder ───────────────────────────────────────────────────────
  var videoWrap = el('div', {'class':'video-placeholder', 'title':'Walkthrough video — coming soon'});
  var playBtn   = el('div', {'class':'video-play'});
  playBtn.innerHTML = '<svg width="16" height="18" viewBox="0 0 16 18" fill="none"><path d="M2 2l12 7-12 7V2z" fill="#FAF6EC"/></svg>';
  videoWrap.appendChild(playBtn);
  videoWrap.appendChild(el('span', {'class':'video-placeholder-label'}, ['Walkthrough video — coming soon']));

  // ── Confirm banner ──────────────────────────────────────────────────────────
  var bannerHeading = isMate
    ? 'Expression of interest received' + (firstName ? ', ' + firstName : '') + '.'
    : 'Registration received' + (firstName ? ', ' + firstName : '') + '.';
  var bannerBody = isMate
    ? "We'll review your details and be in touch within 2 business days. Your commission breakdown is below — and you can jump straight into Referrer.com.au."
    : "We'll be in touch within 2 business days with a proposal tailored to " + (company || 'your platform') + ". Your preferred partner rates are below.";

  var tick = el('div', {'class':'confirm-tick'}, ['✓']);
  var confirmText = el('div', {'class':'confirm-text'});
  confirmText.appendChild(el('h2', {}, [bannerHeading]));
  confirmText.appendChild(el('p',  {}, [bannerBody]));
  var banner = el('div', {'class':'confirm-banner'});
  banner.appendChild(tick);
  banner.appendChild(confirmText);

  // ── Left card (wait) ────────────────────────────────────────────────────────
  var waitHeading = isMate ? "We'll walk you through it" : "We'll walk you through it";
  var waitBody    = isMate
    ? "We'll be in touch within 2 business days to talk through your market, your approach, and whether there's a fit."
    : "We'll call within 2 business days to walk through how the integration works for your specific platform and vendor base.";

  var waitCard = el('div', {'class':'path'});
  waitCard.appendChild(el('p', {'class':'path-label'}, ['Wait for our call']));
  waitCard.appendChild(el('h3', {}, [waitHeading]));
  waitCard.appendChild(el('p',  {}, [waitBody]));
  waitCard.appendChild(isMate ? mateCommission : referrerCommission);
  waitCard.appendChild(videoWrap);

  // ── Right card (jump in) ────────────────────────────────────────────────────
  var jumpHeading = isMate ? 'Join Referrer.com.au now' : 'Set up your account now';
  var jumpBody    = isMate
    ? 'Start building your professional referral network today. Free to join. Your income stream starts from your first referral.'
    : 'Your platform account is waiting. Free to join. No contracts. Your preferred partner rate is locked from day one.';

  var logoWrap = el('div', {'class':'referrer-logo-wrap'});
  logoWrap.innerHTML = logoSvg;

  var jumpBtn = el('a', {'class':'path-btn primary', 'href': signupUrl, 'target':'_blank', 'rel':'noopener'}, ['Join Referrer.com.au →']);

  var jumpCard = el('div', {'class':'path featured'});
  jumpCard.appendChild(logoWrap);
  jumpCard.appendChild(el('p', {'class':'path-label'}, ['Jump right in']));
  jumpCard.appendChild(el('h3', {}, [jumpHeading]));
  jumpCard.appendChild(el('p',  {}, [jumpBody]));
  jumpCard.appendChild(jumpBtn);

  // ── Paths grid ──────────────────────────────────────────────────────────────
  var paths = el('div', {'class':'paths'});
  paths.appendChild(waitCard);
  paths.appendChild(jumpCard);

  // ── Footer note ─────────────────────────────────────────────────────────────
  var footerText = isMate
    ? 'Commission rates, how referral tracking works, and what to expect as a Mate — all at referrer.com.au'
    : 'Full commission details, integration guide, and platform partner terms — all at referrer.com.au';

  var footerNote = el('div', {'class':'footer-note'});
  footerNote.appendChild(el('p', {}, [footerText]));
  footerNote.appendChild(el('a', {'href':'https://referrer.com.au','target':'_blank','rel':'noopener'}, ['referrer.com.au →']));

  // ── Mount ───────────────────────────────────────────────────────────────────
  var main = document.getElementById('pageMain');
  main.appendChild(banner);
  main.appendChild(paths);
  main.appendChild(footerNote);

})();
